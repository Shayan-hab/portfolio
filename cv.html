<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shayan Rasool | Resume</title>
  
  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Main CSS -->
  <link href="assets/css/main.css" rel="stylesheet" />

  <style>
    /* Specific styles for CV page to ensure it acts as a standalone viewer */
    body.cv-page {
      background-color: var(--bg-color);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 100px;
      min-height: 100vh;
    }
    
    .cv-actions {
      position: fixed;
      top: 30px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      padding: 0 20px;
    }
    
    .cv-actions .btn-back {
      position: absolute;
      left: 30px;
    }

    .cv-container {
      width: 100%;
      max-width: 1000px;
      height: 80vh;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 45, 85, 0.2);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      padding: 10px;
      margin-bottom: 50px;
      position: relative;
    }
    
    .cv-container iframe {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      border: none;
      background-color: #fff;
    }

    /* Glow effect around container */
    .cv-container::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(45deg, transparent, var(--accent), transparent);
      z-index: -1;
      border-radius: 14px;
      opacity: 0.5;
      filter: blur(8px);
    }
    
    @media (max-width: 768px) {
      .cv-actions {
        flex-direction: column-reverse;
        align-items: center;
        gap: 10px;
      }
      .cv-actions .btn-back {
        position: relative;
        left: 0;
      }
      .cv-container {
        height: 70vh;
        width: 95%;
        margin-top: 50px;
      }
    }
  </style>
</head>
<body class="dark-theme cv-page">
  <!-- Custom Cursor -->
  <div class="custom-cursor"></div>

  <!-- Background Orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="cv-actions">
    <a href="index.html" class="btn-secondary btn-back magnetic-btn"><i class="bi bi-arrow-left"></i> Back to Portfolio</a>
    <a href="assets/CV.pdf" download="Shayan_Rasool_CV.pdf" class="btn-primary magnetic-btn"><i class="bi bi-download"></i> Download PDF</a>
  </div>

  <div class="cv-container" data-tilt data-tilt-max="2" data-tilt-speed="400">
    <iframe src="assets/CV.pdf"></iframe>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <script>
    // Custom Cursor logic for CV page
    const cursor = document.querySelector('.custom-cursor');
    if (cursor) {
      document.addEventListener('mousemove', (e) => {
        cursor.style.transform = `translate3d(calc(${e.clientX}px - 50%), calc(${e.clientY}px - 50%), 0)`;
      });
      document.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
      });
    }

    // Simple Magnetic Buttons for CV page
    const magneticBtns = document.querySelectorAll('.magnetic-btn');
    magneticBtns.forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        btn.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
      });
      btn.addEventListener('mouseleave', () => {
        btn.style.transform = `translate(0px, 0px)`;
      });
    });
  </script>
</body>
</html>
